name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  android-tests:
    name: Android tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Run unit tests
        run: bash gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: bash gradlew assembleDebug

  deploy-local:
    name: Deploy to local Docker host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - android-tests
    runs-on:
      - self-hosted
      - windows
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose
        shell: pwsh
        env:
          TUIM_ENV_FILE: ${{ secrets.TUIM_ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TUIM_ENV_FILE)) {
            throw "Set the TUIM_ENV_FILE repository secret to the deployment .env contents."
          }

          $envFile = Join-Path $env:GITHUB_WORKSPACE ".env"
          try {
            [System.IO.File]::WriteAllText(
              $envFile,
              $env:TUIM_ENV_FILE,
              [System.Text.UTF8Encoding]::new($false)
            )
            docker compose -p tuim up --build --detach
            if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose deployment failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item -LiteralPath $envFile -Force -ErrorAction SilentlyContinue
          }
